[tool.poetry]
name = "taskjournal"
version = "0.1.0"
description = "A Python project for tracking daily work tasks."
authors = ["Enric Ballo <enric.ballo@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pytest-dotenv = "^0.5.2"
rich = "^13.9.4"
typer = "^0.15.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
freezegun = "^1.5.1"
pytest-mock = "^3.14.0"
pytest-cov = "^6.0.0"
black = "^25.1.0"
pre-commit = "^4.2.0"

[tool.poetry.scripts]
taskjournal = "taskjournal.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=taskjournal --cov-report=term-missing"
