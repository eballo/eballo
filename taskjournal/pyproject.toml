[tool.poetry]
name = "taskjournal"
version = "0.6.0"
description = "A Python project for tracking daily work tasks."
authors = ["Enric Ballo <enric.ballo@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pytest-dotenv = "^0.5.2"
rich = "^13.9.4"
typer = "^0.15.2"
shellingham = "^1.5.4"
jira = "^3.8.0"
pydantic = "^2.11.3"
pygithub = "^2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
freezegun = "^1.5.1"
pytest-mock = "^3.14.0"
pytest-cov = "^6.0.0"
black = "^25.1.0"
pre-commit = "^4.2.0"
poethepoet = "^0.36.0"

[tool.poetry.scripts]
wk = "taskjournal.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=taskjournal --cov-report=term-missing"

[tool.poe.tasks]
# Format code with black
format = "black ."

# Run tests
test = "pytest tests"

# Coverage
coverage = "poetry run pytest --cov=taskjournal --cov-config=.coveragerc --cov-report=xml tests/"

# Run all
check = { sequence = ["format", "test", "coverage"] }
