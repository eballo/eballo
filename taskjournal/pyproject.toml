[tool.poetry]
name = "taskjournal"
version = "0.1.0"
description = "A Python project for tracking daily work tasks."
authors = ["Enric Ballo <enric.ballo@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[tool.poetry.scripts]
taskjournal = "taskjournal.main:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
