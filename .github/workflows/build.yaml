name: Taskjournal CI Build

on:
  push:
    paths:
      - "taskjournal/**"
      - ".github/workflows/build.yaml"
    branches: [ "main" ]
  pull_request:
    paths:
      - "taskjournal/**"
      - ".github/workflows/build.yaml"
    branches: [ "main" ]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Test & SonarCloud
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Important for SonarCloud SCM data

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        working-directory: taskjournal
        run: uv sync --frozen --python 3.14

      - name: Run checks with poe
        working-directory: taskjournal
        run: uv run --frozen poe coverage

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          projectBaseDir: taskjournal
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
