name: Taskjournal CI Build

on:
  push:
    paths:
      - "taskjournal/**"
      - ".github/workflows/build.yaml"
    branches: [ "main" ]
  pull_request:
    paths:
      - "taskjournal/**"
      - ".github/workflows/build.yaml"
    branches: [ "main" ]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Test & SonarCloud
    runs-on: ubuntu-24.04
    env:
      # Empty on Dependabot and fork PRs, which don't receive Actions secrets
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Important for SonarCloud SCM data

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        working-directory: taskjournal
        run: uv sync --frozen --python 3.14

      - name: Run checks with poe
        working-directory: taskjournal
        run: uv run --frozen poe coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          projectBaseDir: taskjournal
