name: Taskjournal CI Build

on:
  push:
    paths:
      - "taskjournal/**"
      - ".github/workflows/taskjournal.yml"
    branches: [ "main" ]
  pull_request:
    paths:
      - "taskjournal/**"
      - ".github/workflows/taskjournal.yml"
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: taskjournal
        run: poetry install

      - name: Run checks with poe
        working-directory: taskjournal
        run: poetry run poe coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: taskjournal
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
