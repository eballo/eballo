name: Bump Version on Merge to Main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bump-version:
    if: "!contains(github.event.head_commit.message, 'Bump version:')"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install bump2version
        working-directory: taskjournal
        run: pip install bump2version

      - name: Configure Git
        working-directory: taskjournal
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Determine bump level from source branch
        id: bump
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Find the PR associated with this commit (works for merge & squash)
          PR_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                           -H "Accept: application/vnd.github+json" \
                           "https://api.github.com/repos/$REPO/commits/$SHA/pulls")
          SRC_BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.[0].head.ref // empty')
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.[0].title // empty')

          # Fallback: parse default merge message if no PR is linked
          if [ -z "$SRC_BRANCH" ]; then
            MERGE_MSG=$(git log -1 --pretty=%B)
            SRC_FULL=$(printf '%s' "$MERGE_MSG" | sed -n 's/.*from \([^ ]*\).*/\1/p')
            SRC_BRANCH="${SRC_FULL#*/}"
          fi
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE=$(git log -1 --pretty=%s)
          fi

          echo "Source branch: ${SRC_BRANCH:-<unknown>}"
          echo "PR title: ${PR_TITLE:-<unknown>}"

          case "$SRC_BRANCH" in
            fix/*)   LEVEL=patch ;;
            major/*) LEVEL=major ;;
            *)       LEVEL=minor ;;
          esac

          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          {
            echo "pr_title<<EOF"
            echo "$PR_TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version (no commit/tag yet)
        id: version
        working-directory: taskjournal
        run: |
          set -euo pipefail
          echo "Bumping: ${{ steps.bump.outputs.level }}"
          OLD_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          bump2version --no-commit --no-tag --current-version "$OLD_VERSION" "${{ steps.bump.outputs.level }}"
          NEW_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update changelog with version and PR comment
        working-directory: taskjournal
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PR_TITLE: ${{ steps.bump.outputs.pr_title }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/change-log.md")
          version = os.environ["NEW_VERSION"].strip()
          title = (os.environ.get("PR_TITLE", "").strip() or "Maintenance update")

          text = path.read_text(encoding="utf-8")
          if not text.startswith("# Changelog"):
              raise SystemExit("Unexpected changelog format: missing '# Changelog' header")

          if f"## {version}\n" in text:
              raise SystemExit(f"Version {version} already exists in changelog")

          rest = text[len("# Changelog"):].lstrip("\n")
          new_entry = f"## {version}\n\n- {title}\n\n"
          path.write_text(f"# Changelog\n\n{new_entry}{rest}".rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit, tag and push
        working-directory: taskjournal
        run: |
          set -euo pipefail
          git add pyproject.toml taskjournal/cli/__init__.py README.md docs/change-log.md
          git commit -m "Bump version: ${{ steps.version.outputs.old_version }} -> ${{ steps.version.outputs.new_version }}"
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push --follow-tags origin main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PR_TITLE: ${{ steps.bump.outputs.pr_title }}
        run: |
          printf '## v%s\n\n- %s\n' "${NEW_VERSION}" "${PR_TITLE}" > /tmp/release-notes.md
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest
